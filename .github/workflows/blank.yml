name: Build Among Us Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip imagemagick

      - name: Extract project
        run: |
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find project
        run: |
          PKG="$(find project -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          test -n "$PKG"
          echo "PROJECT_ROOT=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3

      - name: Build
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          node -e "require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:'com.mhhjhb732.amongusmobile',appName:'Among Us Mobile',webDir:'dist'},null,2))"
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias amongus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Among Us Mobile,O=mhhjhb732-debug,C=CA"

          cat > keystore.properties <<'EOF'
          storeFile=release-key.jks
          storePassword=changeit
          keyAlias=amongus
          keyPassword=changeit
          EOF

          ./gradlew clean assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: among-us-release-apk
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
